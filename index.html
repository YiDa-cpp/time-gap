<!doctype html>
<html
  lang="zh-CN"
  data-mode="light"
  data-theme="light"
  data-phase="idle"
  data-layout="normal"
  data-pinned="false"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时隙</title>
    <script>
      // 启动守护：任何脚本错误/资源加载失败都在界面上直接显现，避免“黑屏无提示”
      (function () {
        function show(message) {
          var el = document.getElementById("boot-error");
          if (!el) {
            el = document.createElement("pre");
            el.id = "boot-error";
            el.style.cssText =
              "position:fixed;inset:12px;margin:0;padding:12px;z-index:9999;overflow:auto;" +
              "background:#fff3f3;color:#b00020;font:12px/1.5 monospace;" +
              "border:1px solid #f3b4b4;border-radius:8px;white-space:pre-wrap;";
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent += message + "\n";
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target !== window && target.tagName) {
              show("[资源加载失败] " + (target.src || target.href || target.tagName));
              return;
            }
            show("[脚本错误] " + (event.message || "unknown") + "\n" + (event.filename || "") + ":" + (event.lineno || 0));
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          show("[未捕获的 Promise] " + (reason && (reason.stack || reason.message || reason)));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <div class="glass-card" data-tauri-drag-region>
        <header class="topbar">
          <div class="brand" data-tauri-drag-region>
            <span class="brand-cn">时隙</span>
            <span class="brand-en">TIMEGAP</span>
          </div>

          <div class="controls">
            <button
              id="pin-btn"
              class="icon-btn pin-btn"
              type="button"
              aria-label="切换置顶"
              aria-pressed="false"
              title="置顶窗口"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="2.5"
                  y="10"
                  width="11"
                  height="3.6"
                  rx="1.2"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <path
                  d="M8 2v5.4M5.6 4.4L8 2l2.4 2.4"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="fullscreen-btn"
              class="icon-btn"
              type="button"
              aria-label="全屏专注"
              title="全屏专注（Esc 退出）"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="compact-btn"
              class="icon-btn"
              type="button"
              aria-label="精简模式"
              title="收起为胶囊"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="theme-btn"
              class="icon-btn"
              type="button"
              aria-label="切换主题"
              title="切换主题：浅色 / 深色 / 跟随系统"
            >
              <svg class="icon icon-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.2" />
                <path
                  d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
              </svg>
              <svg class="icon icon-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
              <svg class="icon icon-auto" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.2" />
                <path d="M8 2.4a5.6 5.6 0 0 1 0 11.2Z" fill="currentColor" opacity="0.85" />
              </svg>
            </button>

            <button id="close-btn" class="icon-btn" type="button" aria-label="关闭窗口" title="关闭">
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path
                  d="M2 2L10 10M10 2L2 10"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </header>

        <div class="fs-controls" aria-hidden="false">
          <button id="pin-fs-btn" class="pill-btn pin-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect
                x="2.5"
                y="10"
                width="11"
                height="3.6"
                rx="1.2"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <path
                d="M8 2v5.4M5.6 4.4L8 2l2.4 2.4"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>置顶</span>
          </button>
          <button id="exit-fs-btn" class="pill-btn" type="button" title="退出全屏（Esc）">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>退出全屏</span>
          </button>
        </div>

        <main class="stage">
          <div class="clock" id="clock" role="timer" aria-label="当前时间">
            <div class="flip-card" data-pair="0"></div>

            <div class="colon" aria-hidden="true"><i></i><i></i></div>

            <div class="flip-card" data-pair="1"></div>

            <div class="colon js-seconds" aria-hidden="true"><i></i><i></i></div>

            <div class="flip-card js-seconds" data-pair="2"></div>
          </div>

          <input
            id="subject"
            class="subject"
            type="text"
            maxlength="24"
            placeholder="正在学什么？"
            autocomplete="off"
            spellcheck="false"
            aria-label="当前科目"
          />

          <div class="actions">
            <button id="primary-btn" class="primary" type="button">开始专注</button>
            <button id="reset-btn" class="ghost-btn" type="button" disabled>结束</button>
          </div>

          <p class="hint">按 <kbd>Space</kbd> 开始 / 暂停</p>
        </main>

        <footer class="footer">
          <button
            id="countdown"
            class="countdown"
            type="button"
            aria-label="倒计时 25:00，点击设置专注时长"
            title="点击设置专注时长"
          >
            25:00
          </button>
          <div id="progress" class="progress" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </footer>

        <div id="duration-pop" class="duration-pop" hidden>
          <span class="duration-label">专注时长（分钟）</span>
          <div class="duration-row">
            <input
              id="duration-input"
              class="duration-input"
              type="number"
              min="1"
              max="180"
              step="1"
              inputmode="numeric"
              aria-label="专注时长（分钟）"
            />
            <button id="duration-ok" class="pill-btn" type="button">确定</button>
            <button id="duration-cancel" class="pill-btn ghost" type="button">取消</button>
          </div>
        </div>

        <button id="expand-btn" class="expand-btn" type="button" title="展开为完整窗口">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
