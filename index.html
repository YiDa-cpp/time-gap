<!doctype html>
<html
  lang="zh-CN"
  data-mode="light"
  data-theme="light"
  data-phase="idle"
  data-layout="normal"
  data-pinned="false"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时隙</title>
    <script>
      // 启动守护：任何脚本错误/资源加载失败都在界面上直接显现，避免“黑屏无提示”
      (function () {
        function show(message) {
          var el = document.getElementById("boot-error");
          if (!el) {
            el = document.createElement("pre");
            el.id = "boot-error";
            el.style.cssText =
              "position:fixed;inset:12px;margin:0;padding:12px;z-index:9999;overflow:auto;" +
              "background:#fff3f3;color:#b00020;font:12px/1.5 monospace;" +
              "border:1px solid #f3b4b4;border-radius:8px;white-space:pre-wrap;";
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent += message + "\n";
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target !== window && target.tagName) {
              show("[资源加载失败] " + (target.src || target.href || target.tagName));
              return;
            }
            show("[脚本错误] " + (event.message || "unknown") + "\n" + (event.filename || "") + ":" + (event.lineno || 0));
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          show("[未捕获的 Promise] " + (reason && (reason.stack || reason.message || reason)));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <div class="glass-card" data-tauri-drag-region>
        <header class="topbar">
          <div class="brand" data-tauri-drag-region>
            <span class="brand-cn">时隙</span>
            <span class="brand-en">TIMEGAP</span>
          </div>

          <div class="controls">
            <button
              id="pin-btn"
              class="icon-btn pin-btn"
              type="button"
              aria-label="切换置顶"
              aria-pressed="false"
              title="置顶窗口"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="2.5"
                  y="10"
                  width="11"
                  height="3.6"
                  rx="1.2"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <path
                  d="M8 2v5.4M5.6 4.4L8 2l2.4 2.4"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="fullscreen-btn"
              class="icon-btn"
              type="button"
              aria-label="全屏专注"
              title="全屏专注（Esc 退出）"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="compact-btn"
              class="icon-btn"
              type="button"
              aria-label="精简模式"
              title="收起为胶囊"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="stats-btn"
              class="icon-btn"
              type="button"
              aria-label="专注统计"
              title="专注统计"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M3 13V8.5M8 13V3.5M13 13V6"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <button
              id="mute-btn"
              class="icon-btn mute-btn"
              type="button"
              aria-label="静音"
              aria-pressed="false"
              title="提示音：开"
            >
              <svg class="icon icon-sound" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M2.5 6.2h2.3L8 3.4v9.2L4.8 9.8H2.5z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
                <path
                  d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 4a5.8 5.8 0 0 1 0 8"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
              </svg>
              <svg class="icon icon-mute" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M2.5 6.2h2.3L8 3.4v9.2L4.8 9.8H2.5z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
                <path
                  d="M10.8 6.2l3.6 3.6M14.4 6.2l-3.6 3.6"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <button
              id="theme-btn"
              class="icon-btn"
              type="button"
              aria-label="切换主题"
              title="切换主题：浅色 / 深色 / 跟随系统"
            >
              <svg class="icon icon-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.2" />
                <path
                  d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
              </svg>
              <svg class="icon icon-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
              <svg class="icon icon-auto" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.2" />
                <path d="M8 2.4a5.6 5.6 0 0 1 0 11.2Z" fill="currentColor" opacity="0.85" />
              </svg>
            </button>

            <button
              id="settings-btn"
              class="icon-btn"
              type="button"
              aria-label="设置"
              title="设置"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M2.5 5h11M2.5 11h11"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <circle cx="6" cy="5" r="1.9" fill="currentColor" />
                <circle cx="10.2" cy="11" r="1.9" fill="currentColor" />
              </svg>
            </button>

            <button id="close-btn" class="icon-btn" type="button" aria-label="关闭窗口" title="关闭">
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path
                  d="M2 2L10 10M10 2L2 10"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </header>

        <div class="fs-controls" aria-hidden="false">
          <button id="pin-fs-btn" class="pill-btn pin-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect
                x="2.5"
                y="10"
                width="11"
                height="3.6"
                rx="1.2"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <path
                d="M8 2v5.4M5.6 4.4L8 2l2.4 2.4"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>置顶</span>
          </button>
          <button id="exit-fs-btn" class="pill-btn" type="button" title="退出全屏（Esc）">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>退出全屏</span>
          </button>
        </div>

        <main class="stage">
          <div class="clock" id="clock" role="timer" aria-label="当前时间">
            <div class="flip-card" data-pair="0"></div>

            <div class="colon" aria-hidden="true"><i></i><i></i></div>

            <div class="flip-card" data-pair="1"></div>

            <div class="colon js-seconds" aria-hidden="true"><i></i><i></i></div>

            <div class="flip-card js-seconds" data-pair="2"></div>
          </div>

          <input
            id="subject"
            class="subject"
            type="text"
            maxlength="24"
            placeholder="正在学什么？"
            autocomplete="off"
            spellcheck="false"
            aria-label="当前科目"
            aria-autocomplete="list"
            aria-expanded="false"
          />

          <div class="actions">
            <button id="primary-btn" class="primary" type="button">开始专注</button>
            <button id="reset-btn" class="ghost-btn" type="button" disabled>结束</button>
          </div>

          <p class="hint">按 <kbd>Space</kbd> 开始 / 暂停</p>
        </main>

        <div id="subject-menu" class="subject-menu" role="listbox" hidden></div>

        <footer class="footer">
          <p class="status" id="status" aria-live="polite"></p>
          <div class="tip-row">
            <span class="tip" id="tip"></span>
            <button id="tip-next" class="tip-next" type="button" aria-label="换一条建议" title="换一换">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7M13.4 2.6v3.2h-3.2"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <button
            id="countdown"
            class="countdown"
            type="button"
            aria-label="倒计时 25:00，点击设置专注时长"
            title="点击设置专注时长"
          >
            25:00
          </button>
          <button
            id="stars"
            class="stars"
            type="button"
            aria-label="今日目标，点击设置"
            title="点击设置今日目标番茄数"
          ></button>
          <div id="goal-pop" class="goal-pop" hidden>
            <span class="goal-title">今日目标（个番茄）</span>
            <div class="goal-grid" id="goal-grid"></div>
          </div>
          <div id="progress" class="progress" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </footer>

        <div id="stats-panel" class="stats-panel" role="dialog" aria-label="专注统计" hidden>
          <header class="stats-head">
            <span class="stats-title">专注统计</span>
            <button id="stats-close" class="stats-close" type="button" aria-label="关闭统计">
              ×
            </button>
          </header>

          <div class="stats-cards">
            <div class="stat-card stat-card--streak">
              <span class="stat-value">
                <svg
                  class="flame"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
                  />
                </svg>
                <span id="stat-streak">0</span>
              </span>
              <span class="stat-label">连续专注（天）</span>
            </div>
            <div class="stat-card">
              <span id="stat-today-min" class="stat-value">0</span>
              <span class="stat-label">今日专注（分钟）</span>
            </div>
            <div class="stat-card">
              <span id="stat-today-count" class="stat-value">0</span>
              <span class="stat-label">今日番茄</span>
            </div>
            <div class="stat-card">
              <span id="stat-total-hours" class="stat-value">0</span>
              <span class="stat-label">累计专注（小时）</span>
            </div>
            <div class="stat-card">
              <span id="stat-longest" class="stat-value">0</span>
              <span class="stat-label">最长单次（分钟）</span>
            </div>
          </div>

          <div class="chart" id="stats-chart" aria-label="最近 7 天专注趋势"></div>

          <div class="subject-block">
            <span class="section-title">科目分布</span>
            <div class="subject-list" id="subject-list"></div>
          </div>

          <div class="stats-foot">
            <p class="stats-hint" id="stats-hint"></p>
            <button id="stats-clear" class="stats-clear" type="button">清空数据</button>
          </div>
        </div>

        <div id="settings-pop" class="settings-pop" hidden>
          <div class="settings-row">
            <div class="settings-text">
              <span class="settings-name">开机自启</span>
              <span class="settings-desc">登录 Windows 后自动在托盘运行</span>
            </div>
            <button
              id="autostart-toggle"
              class="switch"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="开机自启"
            >
              <span class="switch-knob"></span>
            </button>
          </div>
          <p class="settings-hint">关闭窗口不会退出，程序会留在系统托盘。</p>
        </div>

        <div id="confirm-dialog" class="confirm" hidden>
          <div class="confirm-box" role="alertdialog" aria-label="确认清空数据">
            <p class="confirm-title">确定清空所有专注记录？</p>
            <p class="confirm-text">将删除全部历史会话，统计面板会回到空白，此操作不可撤销。</p>
            <div class="confirm-actions">
              <button id="confirm-cancel" class="pill-btn ghost" type="button">取消</button>
              <button id="confirm-ok" class="pill-btn danger" type="button">确认清空</button>
            </div>
          </div>
        </div>

        <div class="ripple-host" id="ripple" aria-hidden="true"></div>
        <div class="breath" aria-hidden="true"></div>

        <div id="duration-pop" class="duration-pop" hidden>
          <span class="duration-label">专注时长（分钟）</span>
          <div class="duration-row">
            <input
              id="duration-input"
              class="duration-input"
              type="number"
              min="1"
              max="180"
              step="1"
              inputmode="numeric"
              aria-label="专注时长（分钟）"
            />
            <button id="duration-ok" class="pill-btn" type="button">确定</button>
            <button id="duration-cancel" class="pill-btn ghost" type="button">取消</button>
          </div>
        </div>

        <button id="expand-btn" class="expand-btn" type="button" title="展开为完整窗口">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
