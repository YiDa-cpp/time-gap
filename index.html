<!doctype html>
<html lang="zh-CN" data-mode="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时隙</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <div class="glass-card" data-tauri-drag-region>
        <header class="topbar">
          <div class="brand" data-tauri-drag-region>
            <span class="brand-cn">时隙</span>
            <span class="brand-en">TIMEGAP</span>
          </div>

          <div class="controls">
            <button
              id="theme-btn"
              class="icon-btn"
              type="button"
              aria-label="切换主题"
              title="切换主题：浅色 / 深色 / 跟随系统"
            >
              <svg
                class="icon icon-sun"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
              >
                <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.2" />
                <path
                  d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                />
              </svg>
              <svg
                class="icon icon-moon"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                class="icon icon-auto"
                viewBox="0 0 16 16"
                fill="none"
                aria-hidden="true"
              >
                <circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.2" />
                <path d="M8 2.4a5.6 5.6 0 0 1 0 11.2Z" fill="currentColor" opacity="0.85" />
              </svg>
            </button>

            <button
              id="close-btn"
              class="icon-btn"
              type="button"
              aria-label="关闭窗口"
              title="关闭"
            >
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path
                  d="M2 2L10 10M10 2L2 10"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </header>

        <main class="stage">
          <div class="clock" id="clock" role="timer" aria-label="计时器 00:00:00">
            <div class="digit-card"><span data-digit="0">0</span></div>
            <div class="digit-card"><span data-digit="1">0</span></div>

            <div class="colon" aria-hidden="true"><i></i><i></i></div>

            <div class="digit-card"><span data-digit="2">0</span></div>
            <div class="digit-card"><span data-digit="3">0</span></div>

            <div class="colon" aria-hidden="true"><i></i><i></i></div>

            <div class="digit-card"><span data-digit="4">0</span></div>
            <div class="digit-card"><span data-digit="5">0</span></div>
          </div>

          <p class="subject" id="subject">正在学什么？</p>

          <button class="primary" type="button" disabled>
            开始专注
          </button>

          <p class="hint">
            按 <kbd>Space</kbd> 开始 · 计时逻辑将在 M1 接入
          </p>
        </main>
      </div>
    </div>
  </body>
</html>
