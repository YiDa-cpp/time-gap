<!doctype html>
<html
  lang="zh-CN"
  data-mode="light"
  data-theme="light"
  data-phase="idle"
  data-layout="normal"
  data-pinned="false"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时隙</title>
    <script>
      // 启动守护：任何脚本错误/资源加载失败都在界面上直接显现，避免“黑屏无提示”
      (function () {
        function show(message) {
          var el = document.getElementById("boot-error");
          if (!el) {
            el = document.createElement("pre");
            el.id = "boot-error";
            el.style.cssText =
              "position:fixed;inset:12px;margin:0;padding:12px;z-index:9999;overflow:auto;" +
              "background:#fff3f3;color:#b00020;font:12px/1.5 monospace;" +
              "border:1px solid #f3b4b4;border-radius:8px;white-space:pre-wrap;";
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent += message + "\n";
        }

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target !== window && target.tagName) {
              show("[资源加载失败] " + (target.src || target.href || target.tagName));
              return;
            }
            show("[脚本错误] " + (event.message || "unknown") + "\n" + (event.filename || "") + ":" + (event.lineno || 0));
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          show("[未捕获的 Promise] " + (reason && (reason.stack || reason.message || reason)));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
            <div class="glass-card">
        <div class="bg-blur" id="bg-blur" aria-hidden="true"></div>
        <div class="bg-layer" id="bg-layer" aria-hidden="true"></div>
        <div class="bg-dim" id="bg-dim" aria-hidden="true"></div>

        <header class="topbar">
          <div class="brand">
            <span class="brand-cn">时隙</span>
            <span class="brand-en">TIMEGAP</span>
          </div>

          <div class="controls">
            <button
              id="pin-btn"
              class="icon-btn pin-btn"
              type="button"
              aria-label="切换置顶"
              aria-pressed="false"
              title="置顶窗口"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect
                  x="2.5"
                  y="10"
                  width="11"
                  height="3.6"
                  rx="1.2"
                  stroke="currentColor"
                  stroke-width="1.2"
                />
                <path
                  d="M8 2v5.4M5.6 4.4L8 2l2.4 2.4"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="stats-btn"
              class="icon-btn"
              type="button"
              aria-label="专注统计"
              title="专注统计"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M3 13V8.5M8 13V3.5M13 13V6"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>

            <button
              id="view-btn"
              class="icon-btn cluster-btn"
              type="button"
              aria-label="显示模式"
              aria-haspopup="true"
              aria-expanded="false"
              title="显示模式：全屏 / 胶囊"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <button
              id="prefs-btn"
              class="icon-btn cluster-btn"
              type="button"
              aria-label="偏好与外观"
              aria-haspopup="true"
              aria-expanded="false"
              title="偏好与外观"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M2.5 5h11M2.5 11h11"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <circle cx="6" cy="5" r="1.9" fill="currentColor" />
                <circle cx="10.2" cy="11" r="1.9" fill="currentColor" />
              </svg>
            </button>

            <button id="close-btn" class="icon-btn" type="button" aria-label="关闭窗口" title="关闭">
              <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path
                  d="M2 2L10 10M10 2L2 10"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </header>

        <div id="view-menu" class="menu-pop" hidden>
          <button id="fullscreen-btn" class="menu-row" type="button">
            <svg class="menu-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="menu-label">全屏专注</span>
            <kbd class="menu-kbd">F</kbd>
          </button>
          <button id="compact-btn" class="menu-row" type="button">
            <svg class="menu-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="menu-label">精简胶囊</span>
            <span class="menu-value">贴边隐藏</span>
          </button>
          <button id="reset-layout-btn" class="menu-row" type="button">
            <svg class="menu-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M3 8a5 5 0 1 1 1.5 3.5M3 12V8h4"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="menu-label">复原时钟位置</span>
          </button>
          <button id="zoom-in-btn" class="menu-row" type="button">
            <span class="menu-icon" aria-hidden="true">＋</span>
            <span class="menu-label">放大时钟</span>
          </button>
          <button id="zoom-out-btn" class="menu-row" type="button">
            <span class="menu-icon" aria-hidden="true">－</span>
            <span class="menu-label">缩小时钟</span>
          </button>
          <p class="menu-hint">按住时钟可拖动 · 滚轮缩放</p>
        </div>

        <div id="prefs-menu" class="menu-pop" hidden>
          <div class="menu-row menu-row--static">
            <span class="menu-label">提示音</span>
            <button
              id="mute-toggle"
              class="switch"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="提示音"
            >
              <span class="switch-knob"></span>
            </button>
          </div>

          <div class="menu-row menu-row--static">
            <span class="menu-label">主题</span>
            <div class="seg" id="theme-seg">
              <button type="button" class="seg-btn" data-theme-mode="light">浅色</button>
              <button type="button" class="seg-btn" data-theme-mode="dark">深色</button>
              <button type="button" class="seg-btn" data-theme-mode="system">自动</button>
            </div>
          </div>

          <button id="appearance-btn" class="menu-row" type="button">
            <svg class="menu-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="5.4" stroke="currentColor" stroke-width="1.3" />
              <circle cx="8" cy="5.4" r="1.2" fill="currentColor" />
              <circle cx="10.6" cy="8.6" r="1.2" fill="currentColor" />
              <circle cx="5.6" cy="9.4" r="1.2" fill="currentColor" />
            </svg>
            <span class="menu-label">外观 DIY</span>
            <span class="menu-value">配色 / 背景</span>
          </button>

          <div class="menu-row menu-row--static">
            <span class="menu-label">开机自启</span>
            <button
              id="autostart-toggle"
              class="switch"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="开机自启"
            >
              <span class="switch-knob"></span>
            </button>
          </div>
        </div>

        <div id="appearance-panel" class="appearance" hidden>
          <header class="appearance-head">
            <span class="appearance-title">外观 DIY</span>
            <button id="appearance-close" class="stats-close" type="button" aria-label="关闭外观设置">
              ×
            </button>
          </header>

          <div class="appearance-section">
            <span class="section-title">主题色</span>
            <div class="swatches" id="accent-swatches"></div>
            <label class="accent-custom">
              <span>自定义</span>
              <input type="color" id="accent-input" value="#4fa8e0" />
            </label>
          </div>

          <div class="appearance-section">
            <span class="section-title">背景图片</span>
            <div class="appearance-actions">
              <label class="pill-btn" for="bg-file">选择图片</label>
              <input type="file" id="bg-file" accept="image/*" hidden />
              <button id="bg-clear" class="ghost-btn" type="button">清除背景</button>
            </div>
          </div>

          <div class="appearance-section">
            <span class="section-title">壁纸文件夹（自动随机）</span>
            <div class="folder-row">
              <input
                id="folder-path"
                class="folder-input"
                type="text"
                placeholder="例如 D:\我的壁纸"
                spellcheck="false"
                autocomplete="off"
              />
              <button id="folder-pick" class="pill-btn" type="button">选择</button>
            </div>
            <div class="appearance-actions">
              <button id="folder-apply" class="ghost-btn" type="button">应用文件夹</button>
              <button id="folder-next" class="ghost-btn" type="button">换一张</button>
            </div>
            <p class="folder-hint" id="folder-hint">支持 .jpg / .jpeg / .png，启动时随机取一张</p>
          </div>

          <div class="appearance-section">
            <span class="section-title">背景参数</span>
            <div class="fit-row">
              <span class="slider-name">填充</span>
              <div class="seg" id="fit-seg">
                <button type="button" class="seg-btn" data-fit="cover">铺满</button>
                <button type="button" class="seg-btn" data-fit="contain">完整</button>
                <button type="button" class="seg-btn" data-fit="fill">拉伸</button>
              </div>
            </div>
            <div class="fit-row" id="bg-pos-row">
              <span class="slider-name">位置</span>
              <div class="seg" id="bg-pos-seg">
                <button type="button" class="seg-btn" data-pos="top">上</button>
                <button type="button" class="seg-btn" data-pos="center">中</button>
                <button type="button" class="seg-btn" data-pos="bottom">下</button>
              </div>
            </div>
            <label class="slider-row">
              <span class="slider-name">模糊</span>
              <input type="range" id="bg-blur" min="0" max="24" step="1" value="0" />
              <span class="slider-value" id="bg-blur-val">0px</span>
            </label>
            <label class="slider-row">
              <span class="slider-name">暗化</span>
              <input type="range" id="bg-dim" min="0" max="90" step="1" value="0" />
              <span class="slider-value" id="bg-dim-val">0%</span>
            </label>
            <label class="slider-row">
              <span class="slider-name">缩放</span>
              <input type="range" id="bg-scale" min="100" max="200" step="5" value="100" />
              <span class="slider-value" id="bg-scale-val">100%</span>
            </label>
            <label class="slider-row">
              <span class="slider-name">通透</span>
              <input type="range" id="card-alpha" min="35" max="100" step="1" value="100" />
              <span class="slider-value" id="card-alpha-val">100%</span>
            </label>
          </div>

          <div class="appearance-foot">
            <button id="appearance-reset" class="stats-clear" type="button">恢复默认</button>
          </div>
        </div>

        <div class="fs-controls" aria-hidden="false">
          <button id="pin-fs-btn" class="pill-btn pin-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect
                x="2.5"
                y="10"
                width="11"
                height="3.6"
                rx="1.2"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <path
                d="M8 2v5.4M5.6 4.4L8 2l2.4 2.4"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>置顶</span>
          </button>
          <button id="exit-fs-btn" class="pill-btn" type="button" title="退出全屏（Esc）">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>退出全屏</span>
          </button>
        </div>

        <main class="stage">
          <div class="clock" id="clock" role="timer" aria-label="当前时间" title="按住拖动位置 · 滚轮缩放大小">
            <div class="flip-card" data-pair="0"></div>

            <div class="colon" aria-hidden="true"><i></i><i></i></div>

            <div class="flip-card" data-pair="1"></div>

            <div class="colon js-seconds" aria-hidden="true"><i></i><i></i></div>

            <div class="flip-card js-seconds" data-pair="2"></div>
          </div>

          <input
            id="subject"
            class="subject"
            type="text"
            maxlength="24"
            placeholder="正在学什么？"
            autocomplete="off"
            spellcheck="false"
            aria-label="当前科目"
            aria-autocomplete="list"
            aria-expanded="false"
          />

          <div class="actions">
            <button id="primary-btn" class="primary" type="button">开始专注</button>
            <button id="reset-btn" class="ghost-btn" type="button" disabled>结束</button>
          </div>

          <p class="hint">按 <kbd>Space</kbd> 开始 / 暂停</p>
        </main>

        <div id="subject-menu" class="subject-menu" role="listbox" hidden></div>

        <footer class="footer">
          <p class="status" id="status" aria-live="polite"></p>
          <div class="tip-row">
            <span class="tip" id="tip"></span>
            <button id="tip-next" class="tip-next" type="button" aria-label="换一条建议" title="换一条学习建议">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7M13.4 2.6v3.2h-3.2"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <button
            id="countdown"
            class="countdown"
            type="button"
            aria-label="倒计时 25:00，点击设置专注时长"
            title="点击设置专注时长"
          >
            25:00
          </button>
          <button
            id="stars"
            class="stars"
            type="button"
            aria-label="今日目标，点击设置"
            title="点击设置今日目标番茄数"
          ></button>
          <div id="goal-pop" class="goal-pop" hidden>
            <span class="goal-title">今日目标（个番茄）</span>
            <div class="goal-grid" id="goal-grid"></div>
          </div>
          <div id="progress" class="progress" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </footer>

        <button id="wallpaper-next" class="quick-action" type="button" aria-label="换一张壁纸" title="换一张壁纸">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.3" />
            <circle cx="5.8" cy="6.4" r="1.1" fill="currentColor" />
            <path
              d="M3.2 11.4l3-3 2.2 2.2 1.6-1.6 2.6 2.6"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div id="stats-panel" class="stats-panel" role="dialog" aria-label="专注统计" hidden>
          <header class="stats-head">
            <span class="stats-title">专注统计</span>
            <button id="stats-close" class="stats-close" type="button" aria-label="关闭统计">
              ×
            </button>
          </header>

          <div class="stats-cards">
            <div class="stat-card stat-card--streak">
              <span class="stat-value">
                <svg
                  class="flame"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
                  />
                </svg>
                <span id="stat-streak">0</span>
              </span>
              <span class="stat-label">连续专注（天）</span>
            </div>
            <div class="stat-card">
              <span id="stat-today-min" class="stat-value">0</span>
              <span class="stat-label">今日专注（分钟）</span>
            </div>
            <div class="stat-card">
              <span id="stat-today-count" class="stat-value">0</span>
              <span class="stat-label">今日番茄</span>
            </div>
            <div class="stat-card">
              <span id="stat-total-hours" class="stat-value">0</span>
              <span class="stat-label">累计专注（小时）</span>
            </div>
            <div class="stat-card">
              <span id="stat-longest" class="stat-value">0</span>
              <span class="stat-label">最长单次（分钟）</span>
            </div>
          </div>

          <div class="chart" id="stats-chart" aria-label="最近 7 天专注趋势"></div>

          <div class="subject-block">
            <span class="section-title">科目分布</span>
            <div class="subject-list" id="subject-list"></div>
          </div>

          <div class="stats-foot">
            <p class="stats-hint" id="stats-hint"></p>
            <button id="stats-clear" class="stats-clear" type="button">清空数据</button>
          </div>
        </div>
        </div>

        <div class="ripple-host" id="ripple" aria-hidden="true"></div>
        <div class="breath" aria-hidden="true"></div>

        <div id="duration-pop" class="duration-pop" hidden>
          <span class="duration-label">专注时长（分钟）</span>
          <div class="duration-row">
            <input
              id="duration-input"
              class="duration-input"
              type="number"
              min="1"
              max="180"
              step="1"
              inputmode="numeric"
              aria-label="专注时长（分钟）"
            />
            <button id="duration-ok" class="pill-btn" type="button">确定</button>
            <button id="duration-cancel" class="pill-btn ghost" type="button">取消</button>
          </div>
        </div>

        <button id="expand-btn" class="expand-btn" type="button" title="展开为完整窗口">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
